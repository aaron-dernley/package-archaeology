manifestVersion: 1
name: "@aaronge/package-archaeology"
version: "2026.11.05.2"
description: "Finds the oldest-touched installed dpkg packages on a Debian/apt-based host, using each package's /var/lib/dpkg/info/<name>.list file mtime as an approximate (honestly-caveated) install date — fun trivia about your system's history."

repository: https://github.com/aaron-dernley/package-archaeology

models:
  - package_archaeology.ts

workflows:
  - workflow-package-archaeology.yaml

additionalFiles:
  - README.md
  - LICENSE

platforms:
  - linux-x86_64
  - linux-aarch64

labels:
  - fun
  - apt
  - debian
